# Minimal CI: server unit tests (node:test, no extra dependencies)
# plus the client production build. Deliberately no `tsc -b` gate
# yet: VoiceRecall.tsx carries two pre-existing type errors on
# untouched lines (see FIXES-STATE slice 7), so a tsc gate would
# fail on code this programme did not touch. No secrets, no deploy,
# no spend in this workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm run build
        working-directory: client
