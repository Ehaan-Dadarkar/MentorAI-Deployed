# Minimal CI: server unit tests (node:test, no extra dependencies)
# plus the client type-check and production build. The `tsc -b`
# gate landed with slice 27, once the last two pre-existing
# VoiceRecall.tsx type errors were fixed there; `vite build`
# alone does not type-check. No secrets, no deploy, no spend
# in this workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npx tsc -b
        working-directory: client
      - run: npm run build
        working-directory: client
